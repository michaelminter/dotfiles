model = "gpt-6.1-sol"
model_reasoning_effort = "high"

service_tier = "default"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[features]
js_repl = false

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?features=docs%2Caccount%2Cdatabase%2Cdebugging%2Cdevelopment%2Cfunctions%2Cbranching"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
followUpQueueMode = "queue"

[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "context-used", "used-tokens", "five-hour-limit", "weekly-limit"]

[tui.model_availability_nux]
gpt-6-astra = 2
"gpt-6.1-sol" = 3
